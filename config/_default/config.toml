# ------------------------------------------------------------------
# 站点基本配置
# 部署前记得把 baseurl 改成你自己的域名
# ------------------------------------------------------------------
baseurl = "https://pengyize2008.github.io/"
title   = "一个芹娜厨的小窝"

# 站点语言：主题的翻译文件是 i18n/zh.toml，所以这里用 "zh"
# （写成 "zh-cn" 会找不到翻译文件，界面就会退回英文）
defaultContentLanguage          = "zh"
defaultContentLanguageInSubdir  = false

# 中文内容必须开启，否则摘要与字数统计会把整段中文当成一个词
hasCJKLanguage = true

# 换成自己的 Disqus 短名称；留空则关闭评论
# 评论：留空即关闭。注册 Disqus 后把 shortname 填在引号里，
# 同时把 params.toml 里 [comments] 的 enabled 改回 true
disqusShortname = ""

[pagination]
    pagerSize = 5
