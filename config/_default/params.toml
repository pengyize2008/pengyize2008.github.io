# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2020
    # 全站版权声明，显示在页脚；此字段会按 HTML 渲染
    customText = '除特别声明不适用外，其他内容均按 <a href="/license/">CC BY-SA 3.0</a> 协议授权。'

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "🍥"
    subtitle = "一些芹娜厨的碎碎念罢了"
    avatar   = "img/avatar.jpg"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        # 每篇文章底部的授权声明；可在文章 front matter 用 license 字段覆盖，
        # 写 license: false 可让该篇不显示
        default = '本文采用 [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/deed.zh-hans) 协议授权'

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
# 暂时关闭：本地预览时 Disqus 本来也不显示，等注册好自己的 shortname 再开
[comments]
    enabled  = false
    provider = "disqus"

