# 语言配置。
# 这里的 zh 必须与主题 i18n 目录下的文件名一致：主题提供的是 zh.toml（简体中文）。
# 显示给访客看的名字由 label 决定。
#
# 想再加英文站的话，取消下面 en 段的注释，并把 contentDir 指向 content/en。

[zh]
    label      = "简体中文"
    contentDir = "content"
    weight     = 1

# [en]
#     label      = "English"
#     contentDir = "content/en"
#     weight     = 2
